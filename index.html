<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Informační panel – řada 854</title>
<style>
:root{--bg:#e9dec3;--fg:#1c1b19;--card:#f6efdc;--line:#c9bd9c;--accent:#d97a00;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#2a2721;--fg:#eceae4;--card:#37332b;--line:#554f42}}
:root[data-theme="dark"]{--bg:#2a2721;--fg:#eceae4;--card:#37332b;--line:#554f42}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;padding:16px}
main{max-width:1100px;margin:0 auto}
h1{font-size:1.15rem;margin:0 0 12px}
.housing{width:100%;background:linear-gradient(180deg,#1a1a1a,#050505);border-radius:12px;padding:2.4%;box-shadow:0 10px 28px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.08),inset 0 0 0 2px #000}
.panel{position:relative;width:100%;aspect-ratio:104/21;background:#030303;border-radius:6px;overflow:hidden}
.panel::after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(115deg,rgba(255,255,255,.06),transparent 38%)}
#cv{width:100%;height:100%;display:block}
.form{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px;margin-top:16px;display:grid;gap:12px;grid-template-columns:1fr 1fr}
label{display:grid;gap:4px;font-size:.8rem;opacity:.9}
label.full{grid-column:1/-1}
label.chk{display:flex;gap:8px;align-items:center}
label.chk input{width:auto}
select,input,textarea{font:inherit;font-size:1rem;padding:9px 10px;border-radius:7px;border:1px solid var(--line);background:var(--bg);color:var(--fg);width:100%}
textarea{min-height:110px;resize:vertical}
.btns{grid-column:1/-1;display:flex;gap:10px}
button{flex:1;font:inherit;font-weight:600;padding:12px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--fg);cursor:pointer}
button.go{background:var(--accent);border-color:var(--accent);color:#111}
.housing.big{padding:1.6%;background:linear-gradient(180deg,#2b2b2b,#0b0b0b 40%,#050505)}
.menu{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:0 0 14px}
@media(max-width:640px){.menu{grid-template-columns:1fr}}
.loco{position:relative;width:100%;aspect-ratio:1333/1050;overflow:hidden;border-radius:10px;background:#cfd6dc;margin-bottom:14px}
.loco{background:#23282d}
.loco img{position:absolute;left:0;top:0;width:100%;display:block;z-index:2}
.loco.front .slot{z-index:3}
.slot{z-index:1;position:absolute;left:53.9%;top:40.86%;width:30.2%;aspect-ratio:104/12;background:#030303;border-radius:1px;overflow:hidden;box-shadow:0 0 0 1px rgba(0,0,0,.5)}
.slot canvas{width:100%;height:100%;display:block}
.cap{font-size:.8rem;opacity:.75;margin:0 0 6px}
.menu button{text-align:left;padding:12px 14px;font-weight:600;line-height:1.3}
.menu button small{display:block;font-weight:400;opacity:.75;margin-top:2px}
.menu button.act{background:var(--accent);border-color:var(--accent);color:#111}
.hide{display:none!important}
@media(max-width:480px){.form{grid-template-columns:1fr}}
</style>
</head>
<body>
<main>
<h1>Informační panel</h1>

<div class="menu">
 <button id="k1" class="act">Malý panel – řada 854<small>2 řádky, 104×21 bodů, jantarová</small></button>
 <button id="k2">Velký panel – linka a cíl<small>linka vlevo, cíl vpravo dole, zastávky nahoře</small></button>
 <button id="k3">Lokomotiva 162/163/362 WTB<small>jednořádkový panel v pravém okně čela</small></button>
</div>

<div class="loco hide" id="loco"><img src="WTB362.png" alt="Lokomotiva 362 s úpravou WTB"><div class="slot" id="slot"><canvas id="cv2"></canvas></div></div>
<p class="cap hide" id="cap">Detail panelu</p>
<div class="housing" id="housing"><div class="panel" id="panel"><canvas id="cv"></canvas></div></div>

<div class="form" id="f3" style="display:none">
 <label>Linka<input id="wline" value="U51" maxlength="5"></label>
 <label>Barva
  <select id="wcolor"><option value="wtb">Červená (jako na fotkách)</option><option value="amber">Jantarová</option></select>
 </label>
 <label class="full">Text (cíl) – když se nevejde, sám se rozjede; když se vejde, stojí na místě
  <input id="wtext" value="Chomutov" maxlength="60">
 </label>
 <label class="full chk"><input type="checkbox" id="wfront"> Panel zobrazit před fotkou (nech vypnuté, až bude okno ve WTB362.png průhledné – panel pak bude vidět za sklem)</label>
 <label>Písmo<select id="wbold"><option value="1">Tučné</option><option value="0">Normální</option></select></label>
 <label>Rychlost posuvu<input id="wspeed" type="number" min="1" max="10" value="5"></label>
 <div class="btns">
  <button class="go" id="wstart">Spustit</button>
  <button id="wstop">Vypnout</button>
 </div>
</div>

<div class="form" id="f2" style="display:none">
 <label class="full">Zobrazení
  <select id="bview">
   <option value="route">Linka vlevo, cíl vpravo dole, nahoře běží zastávky</option>
   <option value="text">Volný text na střed (např. ZKUŠEBNÍ JÍZDA)</option>
  </select>
 </label>
 <label class="br">Linka<input id="bline" value="L2" maxlength="4"></label>
 <label class="br">Cíl<input id="bdest" value="LIBEREC" maxlength="22"></label>
 <label class="bt hide full">Text<input id="btext" value="ZKUŠEBNÍ JÍZDA" maxlength="24"></label>
 <label class="full br">Horní řádek
  <select id="btop">
   <option value="stops">Zastávky, přes které vlak jede (běží)</option>
   <option value="origin">Počáteční zastávka</option>
  </select>
 </label>
 <label class="full br bo hide">Počáteční zastávka<input id="borigin" value="Česká Lípa hl.n." maxlength="30"></label>
 <label class="full br bs">Zastávky (každá na nový řádek)
  <textarea id="bstops">Mimoň
Brniště
Jablonné v Podještědí</textarea>
 </label>
 <label>Barva
  <select id="bcolor"><option value="red">Červeno-oranžová (jako na 1. fotce)</option><option value="amber">Jantarová (jako na 2. fotce)</option></select>
 </label>
 <label>Rychlost posuvu<input id="bspeed" type="number" min="1" max="10" value="5"></label>
 <div class="btns">
  <button class="go" id="bstart">Spustit</button>
  <button id="bstop">Vypnout</button>
 </div>
</div>

<div class="form" id="f1">
 <label class="full">Režim panelu
  <select id="mode">
   <option value="1">Linka a směr (střídá se s tarifem/pásmem a časem)</option>
   <option value="2">Číslo vlaku a vůz (zastávky dole, bez střídání)</option>
  </select>
 </label>
 <label class="m1">Linka<input id="line" value="V2" maxlength="6"></label>
 <label class="m1">Cílová stanice<input id="dest" value="LETOHRAD" maxlength="22"></label>
 <label class="m1">Tarif / pásmo<input id="train" value="IRED0980" maxlength="12"></label>
 <label class="m1">Čas<input id="time" value="10:45" maxlength="5"></label>
 <label class="m2 hide">Číslo vlaku<input id="num" value="R 1148" maxlength="10"></label>
 <label class="m2 hide">Číslo vozu<input id="car" value="10" maxlength="3"></label>
 <label class="full m1 chk"><input type="checkbox" id="cyc" checked> Po dojetí zastávek přepnout na „linka a cíl nahoře, zastávky dole“ a opakovat</label>
 <label class="full m1 chk"><input type="checkbox" id="nxt" checked> Do opakování přidat „příští zastávka nahoře, linka vlevo dole a šipka s cílem uprostřed“</label>
 <div class="full m1" style="display:flex;gap:10px;align-items:center"><button id="nextBtn" style="flex:none">Další zastávka ▶</button><span id="nxtLbl" style="font-size:.85rem"></span></div>
 <label class="full">Zastávky (každá na nový řádek)
  <textarea id="stops">Litice nad Orlicí
Žamberk
Lukavice v Čechách</textarea>
 </label>
 <label class="m1">Střídání spodního řádku (s)<input id="swap" type="number" min="2" max="30" value="5"></label>
 <label>Písmo<select id="bold"><option value="1">Tučné (jako ve vlaku)</option><option value="0">Normální</option></select></label>
 <label>Rychlost posuvu<input id="speed" type="number" min="1" max="10" value="5"></label>
 <div class="btns">
  <button class="go" id="start">Spustit</button>
  <button id="stop">Vypnout</button>
 </div>
</div>
</main>

  function glyph(ch){

    var mn=99,mx=-1;

  function text(str){

  /* zvětší/zmenší bitmapu plošným průměrem (zachová tvar a tloušťku tahů) */
  function scaleRows(rows,tw,th){
    var sh=rows.length, sw=rows[0].length, out=[];
    for(var y=0;y<th;y++){
      var y0=y*sh/th, y1=(y+1)*sh/th, s='';
      for(var x=0;x<tw;x++){
        var x0=x*sw/tw, x1=(x+1)*sw/tw, sum=0;
        for(var j=Math.floor(y0);j<Math.ceil(y1);j++){
          var wy=Math.min(j+1,y1)-Math.max(j,y0);
          for(var i=Math.floor(x0);i<Math.ceil(x1);i++){
            if(rows[j][i]==='#') sum+=wy*(Math.min(i+1,x1)-Math.max(i,x0));
          }
        }
        s+=sum/((x1-x0)*(y1-y0))>=.5?'#':'.';
      }
      out.push(s);
    }
    return out;
  }
  var gcache={};
  /* mode: 'dest' (12 řádků) nebo 'line' (26 řádků); fx = vodorovné zúžení */
  function bglyph(ch,mode,fx){
    var key=mode+fx+ch;
    if(gcache[key]) return gcache[key];
    var base=ch, acc=null;
    if(DACC[ch]){base=DACC[ch][0]; acc=DACC[ch][1]}
    var th=mode==='line'?26:12, rows, g;
    if(mode==='line'&&LF[base]&&fx===1) rows=LF[base];
    else if(DF[base]){
      var sw=DF[base][0].length;
      rows=scaleRows(DF[base],Math.max(2,Math.round(sw*(mode==='line'?1.2:1)*fx)),th);
    }
    if(!rows){ g={w:Math.round(5*fx),pts:[]}; return gcache[key]=g }
    var pts=[], w=rows[0].length;
    rows.forEach(function(r,y){for(var x=0;x<r.length;x++) if(r[x]==='#') pts.push([x,y])});
    if(acc!==null){
      var sy=th/12, mk=MARKS[acc], mh=Math.round(mk.length*sy), mw=Math.max(2,Math.round(mk[0].length*(w/10)*(mode==='line'?1:1)));
      var mrows=scaleRows(mk,mw,mh), gap=Math.max(1,Math.round(sy)), ox=Math.round((w-mw)/2);
      mrows.forEach(function(r,y){for(var x=0;x<r.length;x++) if(r[x]==='#') pts.push([x+ox,y-gap-mh])});
    }

  }
  function btext(str,mode,fx,gap){
    var pts=[], x=0;

      x+=g.w+gap;

  }

  bold=$('bold').value==='1'; showMode(); resize();
  $('mode').addEventListener('change',function(){showMode();if(on)start()});
  $('bold').addEventListener('change',function(){if(on)start()});
  $('start').addEventListener('click',function(){nextIdx=0;updNext();start()});
  $('nextBtn').addEventListener('click',function(){
    var n=stopList().length; if(n) nextIdx=(nextIdx+1)%n; updNext();
    if($('mode').value!=='1') return;
    if(!on) start();
    phaseD();
  });
  $('stops').addEventListener('input',updNext);
  updNext();
  $('stop').addEventListener('click',stop);
  try{
    var sb=JSON.parse(localStorage.getItem('panelBig')||'null');
    if(sb){BFIELDS.forEach(function(k){if(sb[k]!=null)$(k).value=sb[k]})}
  }catch(e){}
  showBigView();
  $('bview').addEventListener('change',function(){
    showBigView();
    $('bcolor').value=$('bview').value==='text'?'amber':'red';
    if(big.on) startBig();
  });
  $('btop').addEventListener('change',function(){showBigView(); if(big.on) startBig()});
  $('bcolor').addEventListener('change',function(){big.color=$('bcolor').value});
  $('bstart').addEventListener('click',startBig);
  $('bstop').addEventListener('click',stop);
  $('k1').addEventListener('click',function(){setKind('small')});
  $('k2').addEventListener('click',function(){setKind('big')});
  try{
    var sw=JSON.parse(localStorage.getItem('panelWtb')||'null');
    if(sw){WFIELDS.forEach(function(k){if(sw[k]!=null)$(k).value=sw[k]})}
  }catch(e){}
  $('k3').addEventListener('click',function(){setKind('wtb')});
  $('wstart').addEventListener('click',startWtb);
  $('wstop').addEventListener('click',stop);
  $('wfront').addEventListener('change',function(){$('loco').classList.toggle('front',$('wfront').checked)});
  $('wcolor').addEventListener('change',function(){wt.color=$('wcolor').value});
  $('wbold').addEventListener('change',function(){if(wt.on) startWtb()});
  window.addEventListener('load',function(){resize()});
  try{var sk=localStorage.getItem('panelKind'); if(sk==='big'||sk==='wtb') setKind(sk)}catch(e){}
  window.addEventListener('resize',function(){resize()});
  raf=requestAnimationFrame(draw);
})();
</script>
</body>
</html>
